name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1
